[build-system]
requires = ["setuptools>=72.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ssot-sync-controller"
version = "0.1.0"
description = "SSOT 同期制御層 — catalog から desired state を生成し ssot-bot へ JSON を渡す"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.2",
]

[project.scripts]
ssot-sync-controller = "ssot_sync_controller.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ssot_sync_controller*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
